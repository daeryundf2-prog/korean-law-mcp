name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # gc = typecheck + knip(dead-code) + test + build
      - run: npm run gc
